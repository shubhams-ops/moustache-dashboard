<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Deals · Moustache PMS</title>
<style>
  :root{
    --bg:#F4F4FB; --card:#FFFFFF; --ink:#25243A; --ink2:#4A4866; --muted:#8B89A6;
    --line:#ECEBF4; --line2:#F4F3FA;
    --indigo:#5B54E4; --indigo2:#6E67F0; --indigo-bg:#EDECFC;
    --green:#217A57; --green-bg:#E3F2EA;
    --red:#E14B4B; --red-bg:#FCECEC;
    --amber:#CC8A22; --amber-bg:#FBF1DC;
    --lav:#EDECFB; --peach:#FBEEDD; --mint:#E4F3EC; --sky:#E6EFFB;
    --sh:0 1px 2px rgba(37,36,58,.04),0 8px 24px rgba(37,36,58,.05);
    --sh2:0 10px 40px rgba(37,36,58,.14);
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font-family:inherit;font-size:14.5px}
  .tnum{font-variant-numeric:tabular-nums}
  a{color:inherit}

  .shell{display:grid;grid-template-columns:236px minmax(0,1fr) 312px;gap:16px;max-width:1500px;margin:0 auto;padding:16px}

  /* ---------- sidebar ---------- */
  .side{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 14px;height:calc(100vh - 32px);position:sticky;top:16px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:18px}
  .brand .t{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .brand .s{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14px}
  .nav a .ic{width:18px;height:18px;opacity:.7}
  .nav a:hover{background:var(--line2)}
  .nav a.on{background:var(--indigo-bg);color:var(--indigo)}
  .nav a.on .ic{opacity:1}
  .side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .side .foot b{color:var(--ink2)}
  .backlink{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;color:var(--muted);font-size:12.5px;font-weight:600}
  .backlink:hover{background:var(--line2)}

  /* ---------- main ---------- */
  .main{min-width:0}
  .greet .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);font-weight:800}
  .greet h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
  .greet p{margin:0 0 20px;color:var(--muted);font-size:15px}
  .propbar{display:flex;align-items:center;gap:10px;margin:-6px 0 22px}
  .propbar-l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .propbar .unitsel{min-width:200px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:flex-start}
  .stat .sq{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
  .stat .sq svg{width:22px;height:22px}
  .stat .lbl{font-size:12.5px;color:var(--muted);font-weight:700}
  .stat .num{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
  .stat .lk{font-size:12.5px;color:var(--indigo);font-weight:700;margin-top:4px;cursor:pointer}
  .stat .lk:hover{text-decoration:underline}
  .stat.big .num{color:var(--ink)}

  .sec-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .sec-head h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0}
  .sec-head .pill{font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:20px;padding:2px 10px}
  .sec-head .pill.red{background:var(--red)}
  .sec-head .spacer{flex:1}
  .btn-add{background:var(--indigo);color:#fff;border-radius:11px;padding:9px 15px;font-weight:700;font-size:13px}
  .btn-add:hover{background:var(--indigo2)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .attn{overflow:hidden;margin-bottom:26px}
  .arow{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--line2)}
  .arow:last-child{border-bottom:0}
  .arow .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .arow .dot.red{background:var(--red)} .arow .dot.amber{background:var(--amber)} .arow .dot.blue{background:var(--indigo)}
  .arow .who b{font-weight:700;font-size:14.5px}
  .arow .who .m{font-size:12.5px;color:var(--muted)}
  .arow .grow{flex:1}
  .arow .amt{font-weight:800;font-size:15px}
  .arow .tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:16px;margin-right:2px}
  .arow .tag.red{background:var(--red-bg);color:var(--red)} .arow .tag.amber{background:var(--amber-bg);color:var(--amber)} .arow .tag.blue{background:var(--indigo-bg);color:var(--indigo)}
  .go{border-radius:10px;padding:8px 14px;font-weight:700;font-size:12.5px;color:#fff}
  .go.red{background:var(--red)} .go.red:hover{filter:brightness(.94)}
  .go.amber{background:var(--amber)} .go.amber:hover{filter:brightness(.94)}
  .go.blue{background:var(--indigo)} .go.blue:hover{filter:brightness(.94)}
  .clear{background:var(--green-bg);border:1px solid #CDE8DA;color:#1c6446;border-radius:var(--r);padding:26px;text-align:center;margin-bottom:26px}
  .clear b{display:block;font-size:17px;font-weight:800;margin-bottom:3px}

  /* portal-style deal cards */
  .portals{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer;position:relative;overflow:hidden;transition:transform .13s,box-shadow .13s;text-align:left}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,36,58,.10)}
  .pcard .sq{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px}
  .pcard .sq svg{width:22px;height:22px}
  .pcard .badge{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:16px;letter-spacing:.01em}
  .badge.red{background:var(--red-bg);color:var(--red)} .badge.amber{background:var(--amber-bg);color:var(--amber)}
  .badge.green{background:var(--green-bg);color:var(--green)} .badge.slate{background:#EEEEF4;color:#6C6A85} .badge.blue{background:var(--indigo-bg);color:var(--indigo)} .badge.setup{background:#F3EEDF;color:#9A7B2E}
  .pcard h3{font-size:15.5px;font-weight:800;margin:0 0 3px;padding-right:70px;line-height:1.25}
  .pcard .desc{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
  .pcard .dperiod{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:12px}
  .pbar{height:7px;background:var(--line2);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .pbar i{display:block;height:100%;background:var(--indigo);border-radius:6px}
  .pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
  .pmeta b{font-weight:800}
  .pcard .open{margin-top:14px;font-size:13px;font-weight:800;color:var(--indigo)}
  .pchart{position:absolute;right:-6px;bottom:-6px;opacity:.10}

  /* ---------- right rail ---------- */
  .rail{position:sticky;top:16px;height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  .searchbox{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--muted);box-shadow:var(--sh)}
  .searchbox input{border:0;outline:0;background:none;width:100%;color:var(--ink)}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
  .rcard h4{margin:0 0 12px;font-size:14px;font-weight:800}
  .rcard .sched{color:var(--muted);font-size:13px}
  .attn-req{background:var(--red-bg);border:1px solid #F4D3D3}
  .attn-req .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:800}
  .attn-req .big{font-size:16px;font-weight:800;margin:7px 0 12px}
  .attn-req .big small{color:var(--ink2);font-weight:700;font-size:13px}
  .attn-req button{background:var(--red);color:#fff;width:100%;border-radius:11px;padding:11px;font-weight:800;font-size:13.5px}
  .attn-req button:hover{filter:brightness(.95)}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;border:1px solid var(--line);border-radius:14px;font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--card)}
  .qa button:hover{background:var(--line2)}
  .qa .qsq{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
  .qa .qsq svg{width:17px;height:17px}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(37,36,58,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(540px,100%);background:var(--bg);z-index:50;box-shadow:var(--sh2);transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dhead{background:var(--card);border-bottom:1px solid var(--line);padding:20px}
  .dhead .x{float:right;background:var(--line2);width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--ink2)}
  .dhead .sq{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
  .dhead h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .dhead .prop{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:3px}
  .dhead .terms{font-size:13px;color:var(--ink2);margin-top:9px}
  .dbody{padding:18px 20px;overflow-y:auto;flex:1}
  .sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
  .sum div{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px}
  .sum .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .sum .v{font-size:18px;font-weight:800;margin-top:4px}
  .mrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px}
  .mtop{display:flex;align-items:center;justify-content:space-between}
  .mtop .mon{font-weight:800;font-size:14.5px}
  .chip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:16px}
  .qty{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)}
  .qty input,.mactions input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:right;background:#fff}
  .qty input{width:78px}.mactions input{width:104px}
  .mactions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .b{border-radius:10px;padding:9px 13px;font-weight:800;font-size:12.5px}
  .b.pri{background:var(--indigo);color:#fff} .b.pri:hover{background:var(--indigo2)}
  .b.ok{background:var(--green);color:#fff}
  .b.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .b.ghost:hover{background:var(--line2)}
  .note{font-size:12.5px;font-weight:700;margin-top:10px}
  .note.green{color:var(--green)} .note.amber{color:var(--amber)} .note.red{color:var(--red)} .note.blue{color:var(--indigo)} .note.muted{color:var(--muted)}

  /* ---------- forms ---------- */
  .form{padding:20px;margin-bottom:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
  .fld label{font-size:12px;font-weight:800;color:var(--ink2)}
  .fld .u{color:var(--muted);font-weight:600}
  .fld input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
  .fbtns{display:flex;gap:10px}
  .dealline{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line2)}
  .dealline:last-child{border-bottom:0}
  .dealline .info{flex:1;min-width:0}
  .dealline .info b{font-size:14.5px;font-weight:700}
  .dealline .info .m{font-size:12.5px;color:var(--muted)}
  .lk{font-weight:800;font-size:13px;color:var(--indigo);padding:6px 8px}
  .lk.del{color:var(--red)}

  input[type=file]{display:none}
  :focus-visible{outline:2.5px solid var(--indigo);outline-offset:2px;border-radius:8px}

  .mobtar{display:none}

  @media (max-width:1180px){
    .shell{grid-template-columns:210px minmax(0,1fr)}
    .rail{display:none}
    .stats,.portals{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:740px){
    .shell{grid-template-columns:1fr;padding:0;gap:0}
    .side{display:none}
    .side.open{display:flex;position:fixed;z-index:60;width:80%;max-width:300px;height:100vh;top:0;left:0;border-radius:0}
    .main{padding:16px}
    .mobtar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .mobtar button{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:18px}
    .greet h1{font-size:24px}
    .stats,.portals{grid-template-columns:1fr}
  }
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .view{animation:fade .22s ease}
  /* line-item table */
  .items{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .ihead,.irow{display:grid;grid-template-columns:1fr 82px 96px 32px;gap:8px;align-items:center;padding:8px 10px}
  .ihead{background:var(--line2);font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .ihead span:nth-child(2),.ihead span:nth-child(3){text-align:right}
  .irow{border-top:1px solid var(--line2)}
  .irow input{border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%;background:#fff}
  .irow input.q,.irow input.p{text-align:right}
  .irow .rm{width:30px;height:30px;border-radius:8px;background:var(--red-bg);color:var(--red);font-size:16px;display:grid;place-items:center}
  .irow .rm:hover{filter:brightness(.96)}
  .addrow{margin-top:10px;border:1px dashed #C9C7E4;color:var(--indigo);border-radius:10px;padding:10px 13px;font-weight:800;font-size:12.5px;background:#fff}
  .addrow:hover{background:var(--indigo-bg)}
  .itotal{margin-top:9px;font-size:13px;font-weight:700;color:var(--ink2);display:flex;gap:18px;flex-wrap:wrap}
  .itotal b{color:var(--ink)}
  .itemslabel{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .unitpick{font-weight:600;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .unitsel{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;font-weight:700;color:var(--indigo);font-size:12.5px}
  input[readonly]{background:var(--line2);color:var(--ink2);cursor:default}
  .ditems{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .ditem{background:var(--line2);border-radius:16px;padding:4px 11px;font-size:11.5px;color:var(--ink2);font-weight:700}
  /* per-item purchase */
  .buys{margin-top:12px;background:#FAFAFE;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .buys-h{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
  .buyrow{display:grid;grid-template-columns:1fr 74px 40px 78px;gap:8px;align-items:center;margin-bottom:7px}
  .buyrow:last-of-type{margin-bottom:0}
  .bname{font-size:13.5px;font-weight:700;color:var(--ink)}
  .bqty{border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:right;background:#fff;width:100%}
  .btgt{font-size:12.5px;color:var(--muted);font-weight:700}
  .bstat{font-size:11.5px;font-weight:800;text-align:right}
  .bstat.ok{color:var(--green)} .bstat.part{color:var(--amber)}
  .buytot{margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--ink2)}
  .buytot b{color:var(--ink)}
  @media (max-width:520px){.buyrow{grid-template-columns:1fr 58px 34px 66px;gap:6px}}
  @media (max-width:520px){.ihead,.irow{grid-template-columns:1fr 60px 78px 28px;gap:6px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* auth chip */
  .authchip{display:flex;align-items:center;gap:9px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;box-shadow:var(--sh)}
  .authchip .who{flex:1;min-width:0}
  .authchip .who .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .authchip .who .rl{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .authchip .who .rl.editor{color:var(--green)} .authchip .who .rl.viewer{color:var(--muted)}
  .authchip .gbtn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:#fff}
  .authchip .gbtn:hover{background:var(--line2)}
  .authchip .gbtn svg{width:15px;height:15px}
  .authchip .lnk{font-size:11.5px;font-weight:700;color:var(--muted)}
  .authchip .lnk:hover{color:var(--red)}
  .ro .btn-add,.ro .addrow,.ro [data-claim],.ro [data-paid],.ro [data-payinput],.ro [data-unclaim],.ro [data-unpay],.ro #qRestore{opacity:.45;pointer-events:none}
  .fbanner{border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px;font-weight:600;display:none}
  .fbanner.show{display:block}
  .fbanner.info{background:var(--indigo-bg);color:var(--ink2)}
  .fbanner.err{background:var(--red-bg);color:#a13030}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">🍺</div>
      <div><div class="t">Bar Deals</div><div class="s">Moustache PMS</div></div>
    </div>
    <nav class="nav" id="nav">
      <a data-view="dashboard" class="on">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/></svg>
        Dashboard</a>
      <a data-view="deals">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
        Deals</a>
    </nav>
    <div style="margin-top:14px">
      <a class="backlink" href="index.html">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        NC &amp; Discount</a>
    </div>
    <div class="foot" id="sfoot"></div>
  </aside>

  <main class="main">
    <div class="mobtar">
      <button id="menuBtn">☰</button>
      <div class="greet" style="margin:0"><div class="eyebrow" style="font-size:10px">Bar Deals</div></div>
    </div>
    <div id="authchip"></div>
    <div class="fbanner" id="fbanner"></div>
    <div id="app"></div>
  </main>

  <aside class="rail" id="rail"></aside>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<input type="file" id="importFile" accept="application/json">

/* ===== Firebase config ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAyIf3HFpSKt9F17H82rBkIvqdgqRVW2HI",
  authDomain: "moustache-bar-dashboard.firebaseapp.com",
  projectId: "moustache-bar-dashboard",
  storageBucket: "moustache-bar-dashboard.firebasestorage.app",
  messagingSenderId: "818303973324",
  appId: "1:818303973324:web:10d7665c1a614738b9cf69"
};
const EDITOR_EMAIL = "shubhams@moustachescapes.com";  // only this account can edit

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const provider = new GoogleAuthProvider();
const dealsDocRef = () => doc(db, "bardeals", "all");

let user = null, canEdit = false, fbUnsub = null, writingLocally = false, loaded = false;

"use strict";
const fmt=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
const money=n=>fmt.format(Math.round(n||0));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const TINTS=["--lav","--peach","--mint","--sky"];

/* ---------- data (Firebase-backed) ---------- */
let state={deals:[],claims:[]};

async function saveState(){
  if(!canEdit){ toastBanner("err","Sign in as "+EDITOR_EMAIL+" to make changes."); return; }
  try{
    writingLocally=true;
    await setDoc(dealsDocRef(), { deals:state.deals, claims:state.claims, _updatedBy:user?user.email:"", _updatedAt:Date.now() });
    setTimeout(()=>{writingLocally=false;},400);
  }catch(err){
    writingLocally=false;
    if(err.code==="permission-denied") toastBanner("err","You don't have permission to edit.");
    else toastBanner("err","Save failed: "+err.code);
  }
}
function save(){ saveState(); }   // alias used throughout

function subscribeDeals(){
  if(fbUnsub) return;
  fbUnsub = onSnapshot(dealsDocRef(),
    snap=>{
      if(writingLocally) return;
      if(snap.exists()){
        const d=snap.data();
        state={deals:d.deals||[],claims:d.claims||[]};
        clearBanner();
      }else{
        state=JSON.parse(JSON.stringify(SEED));
        toastBanner("info","Showing the starter data. "+(canEdit?"Saving it to the shared database…":"An editor needs to save it."));
        if(canEdit) seedOnce();
      }
      loaded=true;
      render();
    },
    err=>{ toastBanner("err","Couldn't load deals ("+err.code+")."); }
  );
}
async function seedOnce(){ try{ await setDoc(dealsDocRef(), { deals:SEED.deals, claims:SEED.claims, _seededBy:user?user.email:"", _seededAt:Date.now() }); }catch(e){} }

/* ---------- helpers / derive ---------- */
const todayISO=()=>new Date().toISOString().slice(0,10);
const nowMonth=()=>todayISO().slice(0,7);
function monthList(start,end){const out=[];if(!start||!end)return out;let[y,m]=start.slice(0,7).split('-').map(Number);const[ey,em]=end.slice(0,7).split('-').map(Number);while(y<ey||(y===ey&&m<=em)){out.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++;}}return out;}
const monLabel=ym=>{const[y,m]=ym.split('-');return `${MON[+m-1]} ${y}`;};
function fmtD(iso){if(!iso)return"—";const[y,m,d]=iso.split('-');return `${d} ${MON[+m-1]} ${y}`;}
const claimFor=(id,mo)=>state.claims.find(c=>c.dealId===id&&c.month===mo);
function slots(deal){const cur=nowMonth();return monthList(deal.start,deal.end).map(month=>{const c=claimFor(deal.id,month);const elapsed=month<=cur;let s;if(c&&c.receivedDate)s="paid";else if(c&&c.claimSent)s="await";else if(elapsed)s="toclaim";else s="upcoming";return{month,claim:c,elapsed,status:s,expected:deal.reimburse};});}
function liftInfo(d,slot){const tgt=+d.committed||0;
  if(d.period==='total'){const done=cumTotalPurchased(d);return{ready:tgt>0&&done>=tgt,remaining:Math.max(0,tgt-done)};}
  const done=+((slot&&slot.claim&&slot.claim.qty)||0);return{ready:tgt>0&&done>=tgt,remaining:Math.max(0,tgt-done)};}
function dealStatus(d){if((+d.committed||0)<=0)return"setup";const s=slots(d);
  if(s.some(x=>x.status==="await"))return"amber";
  const tc=s.filter(x=>x.status==="toclaim");
  if(tc.some(x=>liftInfo(d,x).ready))return"red";
  if(tc.length)return"blue";
  if(d.end<todayISO()&&s.every(x=>x.status==="paid"))return"slate";
  return"green";}
const STXT={red:"Ready to claim",amber:"Payment due",blue:"Lifting due",green:"On track",slate:"Complete",setup:"Set target"};
function dealPeriodText(d){if(!d.start||!d.end)return'';const a=monLabel(d.start.slice(0,7)),b=monLabel(d.end.slice(0,7));return a===b?a:`${a} – ${b}`;}
function actionItems(){const items=[];filteredDeals().forEach(d=>{if((+d.committed||0)<=0)return;const s=slots(d);
  if(d.period==="total"){
    const aw=s.filter(x=>x.status==="await"),tc=s.filter(x=>x.status==="toclaim");
    if(aw.length){const amt=aw.reduce((a,x)=>a+Math.max(0,x.expected-(x.claim.received||0)),0);items.push({d,kind:"pay",when:dealPeriodText(d),month:aw[0].month,expected:amt});}
    else if(tc.length){const li=liftInfo(d,null);
      if(li.ready)items.push({d,kind:"claim",when:dealPeriodText(d),month:tc[0].month,expected:+d.reimburse||0});
      else items.push({d,kind:"lift",when:dealPeriodText(d),remaining:li.remaining});}
  } else {
    s.forEach(x=>{if(x.status==="toclaim"){const li=liftInfo(d,x);items.push({d,kind:li.ready?"claim":"lift",when:monLabel(x.month),month:x.month,expected:x.expected,remaining:li.remaining});}
      else if(x.status==="await")items.push({d,kind:"pay",when:monLabel(x.month),month:x.month,expected:x.expected});});
  }});
  const rank={claim:0,pay:1,lift:2};return items.sort((a,b)=>rank[a.kind]-rank[b.kind]);}
function metrics(){const items=actionItems();let pending=0,onTrack=0;
  filteredDeals().forEach(d=>{const st=dealStatus(d);if(st==="green"||st==="slate")onTrack++;
    slots(d).forEach(x=>{if(x.status==="await")pending+=Math.max(0,x.expected-(x.claim.received||0));});});
  return{pending,toClaim:items.filter(i=>i.kind==="claim").length,lifting:items.filter(i=>i.kind==="lift").length,onTrack,total:filteredDeals().length};}
function dealNumbers(d){const s=slots(d);const cur=nowMonth();const em=s.filter(x=>x.month<=cur).length;let cases=0,claimed=0,received=0;s.forEach(x=>{if(x.claim){cases+=(+x.claim.qty||0);if(x.claim.claimSent)claimed+=x.expected;received+=(+x.claim.received||0);}});const target=(d.period==='total')?(+d.committed||0):d.committed*em;return{cases,claimed,received,pending:claimed-received,em,target,pct:target?cases/target:0,slots:s};}
const cumByItem=(d,name)=>state.claims.filter(c=>c.dealId===d.id).reduce((s,c)=>s+(+((c.byItem||{})[name])||0),0);
const cumTotalPurchased=d=>state.claims.filter(c=>c.dealId===d.id).reduce((s,c)=>s+(+c.qty||0),0);

/* ---------- mutations ---------- */
function ensureClaim(id,mo){let c=claimFor(id,mo);if(!c){c={id:uid(),dealId:id,month:mo,qty:null,claimSent:null,received:null,receivedDate:null,remarks:""};state.claims.push(c);}return c;}
function setQty(id,mo,v){const c=ensureClaim(id,mo);c.qty=v===""?null:+v;save();}
const sumBI=bi=>Object.values(bi||{}).reduce((s,v)=>s+(+v||0),0);
function setBuy(id,mo,item,v){const c=ensureClaim(id,mo);c.byItem=c.byItem||{};
  if(v===""||v==null){delete c.byItem[item];}else{c.byItem[item]=+v;}
  c.qty=sumBI(c.byItem)||null;save();}
function buyCell(d,mo,it){
  const c=claimFor(d.id,mo)||{};const bi=c.byItem||{};const tgt=+it.qty||0;
  if(d.period==='total'){const prog=cumByItem(d,it.name);const met=tgt>0&&prog>=tgt;const need=Math.max(0,tgt-prog);
    return {val:bi[it.name],tgtText:`${prog}/${tgt}`,met,part:prog>0&&!met,statText:tgt?(met?'✓ done':'need '+need):''};}
  const thisMo=+(bi[it.name]||0);const met=tgt>0&&thisMo>=tgt;const need=Math.max(0,tgt-thisMo);
  return {val:bi[it.name],tgtText:`/ ${tgt}`,met,part:thisMo>0&&!met,statText:tgt?(met?'✓ done':'need '+need):''};}
function buyTotText(d,mo){const bi=(claimFor(d.id,mo)||{}).byItem||{};
  if(d.period==='total')return `This month <b>${sumBI(bi)}</b> · Overall <b>${cumTotalPurchased(d)}</b> of ${d.committed} ${unitLabel(d)} total`;
  return `Total <b>${sumBI(bi)}</b> of ${d.committed} ${unitLabel(d)}`;}
function updateBuyUI(id){const d=state.deals.find(x=>x.id===id);if(!d||!d.items)return;
  dealNumbers(d).slots.forEach(s=>{const mo=s.month;
    d.items.forEach((it,idx)=>{const cell=buyCell(d,mo,it);
      const st=document.getElementById(`bstat_${mo}_${idx}`);if(st){st.textContent=cell.statText;st.className='bstat '+(cell.met?'ok':(cell.part?'part':''));}
      const tg=document.getElementById(`btgt_${mo}_${idx}`);if(tg)tg.textContent=cell.tgtText;});
    const tot=document.getElementById(`buytot_${mo}`);if(tot)tot.innerHTML=buyTotText(d,mo);});}
function markClaimed(id,mo){ensureClaim(id,mo).claimSent=todayISO();rerender(id);}
function unclaim(id,mo){const c=claimFor(id,mo);if(c){c.claimSent=null;c.received=null;c.receivedDate=null;}rerender(id);}
function markPaid(id,mo,amt){const c=ensureClaim(id,mo);c.received=+amt||0;c.receivedDate=todayISO();if(!c.claimSent)c.claimSent=todayISO();rerender(id);}
function unpay(id,mo){const c=claimFor(id,mo);if(c){c.received=null;c.receivedDate=null;}rerender(id);}

/* ---------- icons ---------- */
function icoCoins(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>`;}
function icoSend(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>`;}
function icoCheck(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>`;}
function icoGlass(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14l-1.5 8.5a4 4 0 01-4 3.5h-3a4 4 0 01-4-3.5zM12 15v6M8 21h8"/></svg>`;}
function faintChart(){return `<svg class="pchart" width="120" height="80" viewBox="0 0 120 80"><rect x="10" y="40" width="16" height="40" rx="4" fill="#6E67F0"/><rect x="34" y="22" width="16" height="58" rx="4" fill="#8B89A6"/><rect x="58" y="52" width="16" height="28" rx="4" fill="#6E67F0"/><rect x="82" y="12" width="16" height="68" rx="4" fill="#8B89A6"/></svg>`;}

/* ---------- render ---------- */
let currentView="dashboard";
let propFilter="all";
let searchQuery="";
const dealTitle=d=>esc(d.supplier||d.brand||"Untitled deal");
const properties=()=>[...new Set(state.deals.map(d=>d.property).filter(Boolean))].sort();
function filteredDeals(){if(propFilter!=="all"&&!properties().includes(propFilter))propFilter="all";
  return propFilter==="all"?state.deals:state.deals.filter(d=>d.property===propFilter);}
function render(){ if(!loaded){document.getElementById('app').innerHTML='<div class="clear" style="grid-column:1/-1"><b>Loading…</b>Fetching your deals.</div>';return;}
  document.body.classList.toggle('ro',!canEdit);
  currentView==="deals"?renderDeals():renderDashboard();renderRail();renderFoot();renderAuth();}
function renderFoot(){document.getElementById('sfoot').innerHTML=`Live shared data on <b>Firebase</b>. Only ${EDITOR_EMAIL} can edit.`;}

function renderDashboard(){
  const m=metrics(),items=actionItems();const fd=filteredDeals();const props=properties();
  const q=(searchQuery||'').trim().toLowerCase();
  const visible=q?fd.filter(d=>((d.supplier||'')+' '+(d.brand||'')+' '+(d.property||'')).toLowerCase().includes(q)):fd;
  document.getElementById('app').innerHTML=`
  <section class="view">
    <div class="greet">
      <div class="eyebrow">Bar Deals Portal</div>
      <h1>Your supplier deals at a glance</h1>
      <p>Here's what's earning, what to claim, and what to collect today.</p>
    </div>

    ${props.length>1?`<div class="propbar"><span class="propbar-l">Property</span>
      <select id="propFilter" class="unitsel">
        <option value="all"${propFilter==='all'?' selected':''}>All properties</option>
        ${props.map(p=>`<option value="${esc(p)}"${propFilter===p?' selected':''}>${esc(p)}</option>`).join('')}
      </select></div>`:''}

    <div class="stats">
      <div class="stat big">
        <div class="sq" style="background:var(--lav);color:var(--indigo)">${icoCoins()}</div>
        <div><div class="lbl">Money owed to you</div><div class="num tnum">${money(m.pending)}</div>
        <div class="lk" data-scroll>Review →</div></div>
      </div>
      <div class="stat">
        <div class="sq" style="background:var(--red-bg);color:var(--red)">${icoSend()}</div>
        <div><div class="lbl">Claims to send</div><div class="num tnum">${m.toClaim}</div>
        <div class="lk" data-scroll>Handle →</div></div>
      </div>
      <div class="stat">
        <div class="sq" style="background:var(--green-bg);color:var(--green)">${icoCheck()}</div>
        <div><div class="lbl">Deals on track</div><div class="num tnum">${m.onTrack}<span style="font-size:17px;color:var(--muted);font-weight:700"> / ${m.total}</span></div>
        <div class="lk" data-view-link="deals">Manage →</div></div>
      </div>
    </div>

    <div class="sec-head" id="attnAnchor"><h2>Needs your attention</h2>${items.length?`<span class="pill red">${items.length}</span>`:''}</div>
    ${items.length?`<div class="panel attn">${items.map(it=>{
        const meta=`<div class="who"><b>${dealTitle(it.d)}</b><div class="m">${esc(it.d.property)} · ${it.when}</div></div><span class="grow"></span>`;
        if(it.kind==="claim")return `<div class="arow"><span class="dot red"></span>${meta}
          <span class="tag red">Ready to claim</span><span class="amt tnum">${money(it.expected)}</span>
          <button class="go red" data-claim="${it.d.id}|${it.month}">Mark claimed</button></div>`;
        if(it.kind==="pay")return `<div class="arow"><span class="dot amber"></span>${meta}
          <span class="tag amber">Awaiting</span><span class="amt tnum">${money(it.expected)}</span>
          <button class="go amber" data-paid="${it.d.id}|${it.month}|${it.expected}">Mark paid</button></div>`;
        return `<div class="arow"><span class="dot blue"></span>${meta}
          <span class="tag blue">Lifting due</span><span class="amt tnum" style="color:var(--muted)">${it.remaining} ${unitLabel(it.d)} left</span>
          <button class="go blue" data-open="${it.d.id}">Open</button></div>`;
      }).join('')}</div>`
      :`<div class="clear"><b>You're all caught up.</b>Nothing to lift, claim, or chase.</div>`}

    <div class="sec-head"><h2>Your deals</h2><span class="pill">${visible.length}</span><span class="spacer"></span>
      <button class="btn-add" data-view-link="deals">+ Add deal</button></div>
    <div class="portals">${visible.map(dealCard).join('')||`<div class="clear" style="grid-column:1/-1"><b>No deals match.</b>${searchQuery?'Try a different search.':'Add your first deal.'}</div>`}</div>
  </section>`;
}
function dealCard(d,i){
  const n=dealNumbers(d),st=dealStatus(d);
  const tint=TINTS[state.deals.indexOf(d)%TINTS.length];
  const pct=Math.min(100,Math.round(n.pct*100));
  return `<button class="pcard" data-open="${d.id}">
    <div class="sq" style="background:var(${tint});color:var(--indigo)">${icoGlass()}</div>
    <span class="badge ${st}">${STXT[st]}</span>
    <h3>${dealTitle(d)}</h3>
    <div class="desc">${esc(d.property)}</div>
    <div class="dperiod">${dealPeriodText(d)}</div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="pmeta"><span>${n.target>0?`<b>${n.cases}</b> / ${n.target} ${unitLabel(d)}${d.period==='total'?' total':''}`:`<b style="color:var(--slate)">No target set</b>`}</span>
      ${n.pending>0
        ?`<span style="color:var(--amber);font-weight:700">Pending ${money(n.pending)}</span>`
        :`<span style="color:var(--muted)">Earns <b>${money(d.reimburse)}</b>${d.period==='total'?'':'/mo'}</span>`}</div>
    <div class="open">Open →</div>
    ${faintChart()}
  </button>`;
}
function emptyDeals(){return `<div class="clear" style="grid-column:1/-1"><b>No deals yet.</b>Add your first supplier deal to start tracking.</div>`;}

  document.getElementById('rail').innerHTML=`
    <div class="searchbox">

        <button id="qRestore"><span class="qsq" style="background:var(--peach);color:var(--amber)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 3h16"/></svg></span>Restore</button>
      </div>
    </div>`;

/* ---------- deals manager ---------- */
let editing=null;
let formLines=[];
let formUnit='cases';
let formPeriod='month';
function renderDeals(){
  document.getElementById('app').innerHTML=`<section class="view">
    <div class="greet"><div class="eyebrow">Bar Deals Portal</div><h1>${editing!==null?(editing.id?'Edit deal':'Add a deal'):'Deals'}</h1>
      <p>Add each supplier deal once — the dashboard tracks the rest.</p></div>
    <div class="sec-head"><h2>${editing!==null?'Deal details':'All deals'}</h2><span class="spacer"></span>
      ${editing!==null?'':'<button class="btn-add" id="newDeal">+ Add deal</button>'}</div>
    ${editing!==null?dealForm(editing):`<div class="panel">${state.deals.map(dealLine).join('')||emptyDeals()}</div>`}
  </section>`;
}
function dealLine(d){return `<div class="dealline">
  <div class="info"><b>${esc(d.brand)}</b><div class="m">${esc(d.property)} · ${esc(d.terms||'')} · ${fmtD(d.start)} → ${fmtD(d.end)}</div></div>
  <button class="lk" data-edit="${d.id}">Edit</button><button class="lk del" data-delete="${d.id}">Delete</button></div>`;}
function dealForm(d){
  d=d&&d.id?d:{property:"",brand:"",supplier:"",terms:"",committed:"",reimburse:"",start:"",end:""};
  seedFormLines(d);
  formUnit=d.unit||'cases';
  formPeriod=d.period||'month';
  return `<div class="panel form" id="form">
    <div class="grid2">
      <div class="fld"><label>Property</label><input id="f_property" value="${esc(d.property)}" placeholder="Property 1"></div>
      <div class="fld"><label>Supplier / company</label><input id="f_supplier" value="${esc(d.supplier||'')}" placeholder="AB InBev"></div>
    </div>
    <div class="fld"><label>Commitment basis</label>
      <select id="f_period" class="unitsel" style="color:var(--ink);width:100%;max-width:340px">
        <option value="month"${formPeriod==='month'?' selected':''}>Per month — buy this quantity each month</option>
        <option value="total"${formPeriod==='total'?' selected':''}>Total for the whole deal period</option>
      </select>
      <div class="chiphint" id="periodHint">${periodHintText()}</div>
    </div>
    <div class="fld"><label class="itemslabel"><span>Items in this deal</span>
        <span class="unitpick">Qty in <select id="f_unit" class="unitsel">
          <option value="cases"${formUnit==='cases'?' selected':''}>Cases</option>
          <option value="bottles"${formUnit==='bottles'?' selected':''}>Bottles</option>
        </select></span></label>
      <div class="items" id="itemsTable">
        <div class="ihead"><span>Item name</span><span id="qtyHead">${qtyHeadText()}</span><span>Price / <span id="priceUnit">${unitSingular(formUnit)}</span> (₹)</span><span></span></div>
        ${formLines.map(itemRowHTML).join('')}
      </div>
      <button class="addrow" id="addItem">+ Add item</button>
      <div class="itotal" id="itemsTotal">${totalsText()}</div>
    </div>
    <div class="fld"><label>Deal terms <span class="u">(for reference)</span></label><input id="f_terms" value="${esc(d.terms)}" placeholder="₹11,000 on 40 cases / month"></div>
    <div class="grid2">

/* ---------- drawer ---------- */
let openDealId=null;
function openDeal(id){openDealId=id;drawDetail();document.getElementById('scrim').classList.add('open');const dr=document.getElementById('drawer');dr.classList.add('open');dr.setAttribute('aria-hidden','false');}
function closeDeal(){openDealId=null;document.getElementById('scrim').classList.remove('open');const dr=document.getElementById('drawer');dr.classList.remove('open');dr.setAttribute('aria-hidden','true');render();}
function chipFor(d,slot){const st=slot.status;
  if(st==="toclaim"){return liftInfo(d,slot).ready?`<span class="chip badge red">Ready to claim</span>`:`<span class="chip badge blue">Lifting due</span>`;}
  const map={paid:['green','Paid'],await:['amber','Payment due'],upcoming:['slate','Upcoming']};const[c,t]=map[st];return `<span class="chip badge ${c}">${t}</span>`;}
function drawDetail(){
  const d=state.deals.find(x=>x.id===openDealId);if(!d)return;
  const n=dealNumbers(d);
  const rows=n.slots.map(s=>{
    const c=s.claim||{};let action="";
    if(s.status==="paid"){action=`<div class="note green">✓ Paid ${money(c.received)} on ${fmtD(c.receivedDate)}
        <button class="b ghost" style="padding:6px 10px;margin-left:8px" data-unpay="${d.id}|${s.month}">Undo</button></div>`;}
    else if(s.status==="await"){action=`<div class="note amber">Claimed ${fmtD(c.claimSent)} — waiting on payment</div>
        <div class="mactions"><input type="number" inputmode="numeric" placeholder="${d.reimburse}" id="pay_${s.month}" value="${c.received??''}">
        <button class="b ok" data-payinput="${d.id}|${s.month}">Mark paid</button>
        <button class="b ghost" data-unclaim="${d.id}|${s.month}">Not claimed</button></div>`;}
    else if(s.status==="toclaim"){const li=liftInfo(d,s);
      action=li.ready
        ?`<div class="mactions"><button class="b pri" data-claim="${d.id}|${s.month}">Mark claimed</button>
          <span class="note red" style="margin:0">Lifting complete — send the claim.</span></div>`
        :`<div class="mactions"><span class="note blue" style="margin:0">Still lifting — ${li.remaining} ${unitLabel(d)} to go before you claim.</span>
          <button class="b ghost" data-claim="${d.id}|${s.month}">Claim anyway</button></div>`;}
    else{action=`<div class="note muted">Upcoming — nothing to do yet.</div>`;}
    let qtyHtml;
    if(d.items&&d.items.length){
      if(c.qty>0&&!c.byItem&&d.items.length===1){c.byItem={[d.items[0].name]:c.qty};}
      qtyHtml=`<div class="buys" id="buys_${s.month}"><div class="buys-h">${d.period==='total'?'Purchased this month (counts toward the total)':'Purchased this month — by item'}</div>
        ${d.items.map((it,idx)=>{const cell=buyCell(d,s.month,it);
          return `<div class="buyrow"><span class="bname">${esc(it.name)}</span>
            <input class="bqty" type="number" inputmode="numeric" value="${cell.val??''}" placeholder="0" data-buy="${d.id}|${s.month}|${encodeURIComponent(it.name)}">
            <span class="btgt" id="btgt_${s.month}_${idx}">${cell.tgtText}</span>
            <span class="bstat ${cell.met?'ok':(cell.part?'part':'')}" id="bstat_${s.month}_${idx}">${cell.statText}</span></div>`;}).join('')}
        <div class="buytot" id="buytot_${s.month}">${buyTotText(d,s.month)}</div></div>`;
    } else {
      qtyHtml=`<div class="qty">${unitLabel(d)==='bottles'?'Bottles':'Cases'} purchased <input type="number" inputmode="numeric" value="${c.qty??''}" placeholder="${d.committed}" data-qty="${d.id}|${s.month}">
        <span style="color:var(--muted)">of ${d.committed} ${unitLabel(d)} committed</span></div>`;
    }
    return `<div class="mrow"><div class="mtop"><span class="mon">${monLabel(s.month)}</span>${chipFor(d,s)}</div>
      ${qtyHtml}${action}</div>`;
  }).join('');
  const tint=TINTS[state.deals.indexOf(d)%TINTS.length];
  document.getElementById('drawer').innerHTML=`
    <div class="dhead"><button class="x" data-close>×</button>
      <div class="sq" style="background:var(${tint});color:var(--indigo)">${icoGlass()}</div>
      <h3>${dealTitle(d)}</h3>
      <div class="prop">${esc(d.property)}</div>
      <div class="terms">${esc(d.terms||'')} &nbsp;·&nbsp; ${fmtD(d.start)} → ${fmtD(d.end)}</div>
      ${d.items&&d.items.length?`<div class="ditems">${d.items.map(it=>`<span class="ditem">${esc(it.name)} · ${(+it.qty||0)} ${unitLabel(d)}${it.price?` · ₹${(+it.price).toLocaleString('en-IN')}`:''}</span>`).join('')}</div>`:''}
    </div>
    <div class="dbody">
      <div class="sum">
        <div><div class="k">Claimed</div><div class="v tnum">${money(n.claimed)}</div></div>
        <div><div class="k">Received</div><div class="v tnum">${money(n.received)}</div></div>
        <div><div class="k">Pending</div><div class="v tnum" style="color:${n.pending>0?'var(--amber)':'var(--green)'}">${money(n.pending)}</div></div>
      </div>${rows}</div>`;
}

document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a[data-view]');if(!a)return;e.preventDefault();switchView(a.dataset.view);});
function switchView(v){currentView=v;editing=null;[...document.querySelectorAll('#nav a')].forEach(x=>x.classList.toggle('on',x.dataset.view===v));document.getElementById('side').classList.remove('open');render();}
document.getElementById('menuBtn')?.addEventListener('click',()=>document.getElementById('side').classList.toggle('open'));

document.body.addEventListener('click',e=>{
  const t=e.target;
  const vl=t.closest('[data-view-link]');if(vl){switchView(vl.dataset.viewLink);return;}
  if(t.closest('[data-scroll]')){switchView('dashboard');setTimeout(()=>document.getElementById('attnAnchor')?.scrollIntoView({behavior:'smooth'}),60);return;}
  const op=t.closest('[data-open]');if(op){openDeal(op.dataset.open);return;}
  if(t.closest('[data-close]')){closeDeal();return;}
  const cl=t.closest('[data-claim]');if(cl){const[i,mo]=cl.dataset.claim.split('|');markClaimed(i,mo);return;}
  const pd=t.closest('[data-paid]');if(pd){const[i,mo,a]=pd.dataset.paid.split('|');markPaid(i,mo,a);return;}
  const pi=t.closest('[data-payinput]');if(pi){const[i,mo]=pi.dataset.payinput.split('|');const v=document.getElementById('pay_'+mo).value;const d=state.deals.find(x=>x.id===i);markPaid(i,mo,v===''?d.reimburse:v);return;}
  const uc=t.closest('[data-unclaim]');if(uc){const[i,mo]=uc.dataset.unclaim.split('|');unclaim(i,mo);return;}
  const up=t.closest('[data-unpay]');if(up){const[i,mo]=up.dataset.unpay.split('|');unpay(i,mo);return;}
  if(t.id==='newDeal'){editing={};renderDeals();return;}
  if(t.id==='addItem'){addItemRow();return;}
  const ed=t.closest('[data-edit]');if(ed){editing=state.deals.find(x=>x.id===ed.dataset.edit);renderDeals();return;}
  const dl=t.closest('[data-delete]');if(dl){const d=state.deals.find(x=>x.id===dl.dataset.delete);if(confirm(`Delete "${d.brand}" and its claim history? This can't be undone.`)){state.deals=state.deals.filter(x=>x.id!==d.id);state.claims=state.claims.filter(c=>c.dealId!==d.id);save();renderDeals();}return;}
  if(t.id==='cancelDeal'){editing=null;renderDeals();return;}
  if(t.id==='saveDeal'){saveDealForm();return;}
  if(t.id==='qBackup'){doBackup();return;}
  if(t.id==='qRestore'){document.getElementById('importFile').click();return;}
});
document.body.addEventListener('change',e=>{if(e.target&&e.target.id==='f_unit')applyUnit(e.target.value);if(e.target&&e.target.id==='f_period')applyPeriod(e.target.value);if(e.target&&e.target.id==='propFilter'){propFilter=e.target.value;render();}});
document.body.addEventListener('input',e=>{const q=e.target.closest('[data-qty]');if(q){const[i,mo]=q.dataset.qty.split('|');setQty(i,mo,e.target.value);}
  const bq=e.target.closest('[data-buy]');if(bq){const[i,mo,itemEnc]=bq.dataset.buy.split('|');const item=decodeURIComponent(itemEnc);setBuy(i,mo,item,e.target.value);updateBuyUI(i,mo);}
  const rs=e.target.closest('#railSearch');if(rs){searchQuery=rs.value;if(currentView==='dashboard')renderDashboard();}
  const ri=e.target.closest('.irow input[data-f]');if(ri){const lid=ri.closest('.irow').dataset.lid;const f=ri.dataset.f;const l=formLines.find(x=>x.lid===lid);if(l){l[f]=ri.value;if(f==='qty'||f==='price')refreshTotals();}}});

/* ---------- line-item table ---------- */
function seedFormLines(d){
  if(d.items&&d.items.length){formLines=d.items.map(it=>({lid:uid(),name:it.name||'',qty:it.qty??'',price:it.price??''}));}
  else{const nm=d.brand?d.brand.split(',').map(s=>s.trim()).filter(Boolean):[];
    formLines=nm.length?nm.map((n,i)=>({lid:uid(),name:n,qty:(i===0?(d.committed||''):''),price:''})):[{lid:uid(),name:'',qty:'',price:''}];}
}
function itemRowHTML(l){return `<div class="irow" data-lid="${l.lid}">
  <input data-f="name" value="${esc(l.name)}" placeholder="e.g. Budweiser">
  <input class="q" data-f="qty" type="number" inputmode="numeric" value="${l.qty}" placeholder="0">
  <input class="p" data-f="price" type="number" inputmode="numeric" value="${l.price}" placeholder="0">
  <button class="rm" data-rmrow="${l.lid}" title="Remove">×</button></div>`;}
const sumQty=()=>formLines.reduce((s,l)=>s+(+l.qty||0),0);
const sumValue=()=>formLines.reduce((s,l)=>s+((+l.qty||0)*(+l.price||0)),0);
const unitLabel=d=>((d&&d.unit)==='bottles')?'bottles':'cases';
const unitSingular=u=>u==='bottles'?'bottle':'case';
function totalsText(){return `<span>Total committed: <b>${sumQty()} ${formUnit}</b></span><span>Items value: <b>${money(sumValue())}</b> / month</span>`;}
function refreshTotals(){const t=document.getElementById('itemsTotal');if(t)t.innerHTML=totalsText();const c=document.getElementById('f_committed');if(c)c.value=sumQty();}
const qtyHeadText=()=>formPeriod==='total'?`Total qty (${formUnit})`:`Qty (${formUnit})`;
const committedLabelText=()=>formPeriod==='total'
  ?`Committed ${formUnit} — whole deal <span class="u">(auto — sum of item totals)</span>`
  :`Committed ${formUnit} / month <span class="u">(auto — sum of item qty)</span>`;
const periodHintText=()=>formPeriod==='total'
  ?'The quantities below are the <b>total</b> to buy across the entire deal period, tracked cumulatively month by month.'
  :'The quantities below are what you commit to buy <b>every month</b>.';
const reimburseLabelText=()=>formPeriod==='total'
  ?'Reimbursement — whole deal <span class="u">(₹)</span>'
  :'Reimbursement / month <span class="u">(₹)</span>';
function updateFormLabels(){
  const qh=document.getElementById('qtyHead');if(qh)qh.textContent=qtyHeadText();
  const pu=document.getElementById('priceUnit');if(pu)pu.textContent=unitSingular(formUnit);
  const cl=document.getElementById('committedLabel');if(cl)cl.innerHTML=committedLabelText();
  const ph=document.getElementById('periodHint');if(ph)ph.innerHTML=periodHintText();
  const rl=document.getElementById('reimburseLabel');if(rl)rl.innerHTML=reimburseLabelText();
  refreshTotals();}
function applyUnit(u){formUnit=u;updateFormLabels();}
function applyPeriod(p){formPeriod=p;updateFormLabels();}
function addItemRow(){const l={lid:uid(),name:'',qty:'',price:''};formLines.push(l);
  const tbl=document.getElementById('itemsTable');if(tbl){tbl.insertAdjacentHTML('beforeend',itemRowHTML(l));const row=tbl.querySelector(`[data-lid="${l.lid}"] input`);row&&row.focus();}refreshTotals();}
function removeItemRow(lid){formLines=formLines.filter(l=>l.lid!==lid);
  const row=document.querySelector(`.irow[data-lid="${lid}"]`);row&&row.remove();
  if(!formLines.length)addItemRow();else refreshTotals();}

document.body.addEventListener('click',e=>{const rmr=e.target.closest('[data-rmrow]');if(rmr){removeItemRow(rmr.dataset.rmrow);}});

function saveDealForm(){
  const g=id=>document.getElementById(id).value.trim();
  const clean=formLines.map(l=>({name:(l.name||'').trim(),qty:+l.qty||0,price:+l.price||0})).filter(l=>l.name);
  const brand=clean.map(l=>l.name).join(', ');
  const committed=clean.reduce((s,l)=>s+l.qty,0);
  const rec={property:g('f_property'),supplier:g('f_supplier'),brand,items:clean,unit:(document.getElementById('f_unit')||{}).value||'cases',period:(document.getElementById('f_period')||{}).value||'month',terms:g('f_terms'),committed,reimburse:+g('f_reimburse')||0,start:g('f_start'),end:g('f_end')};
  if(!brand||!rec.start||!rec.end){alert("Please add at least one item (with a name), a start date and an end date.");return;}
  if(editing&&editing.id){Object.assign(editing,rec);}else{state.deals.push({id:uid(),...rec});}
  editing=null;save();renderDeals();
}

async function doBackup(){
  const out={deals:state.deals,claims:state.claims,attachments:[],_files:[]};
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`bar-deals-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);
}
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const data=JSON.parse(r.result);if(!data.deals||!data.claims)throw 0;
    if(!canEdit){alert("Sign in as "+EDITOR_EMAIL+" to restore.");return;}
    if(!confirm("Replace everything with this backup file?"))return;
    state={deals:data.deals,claims:data.claims};save();render();
  }catch(err){alert("That file couldn't be read as a Bar Deals backup.");}};
  r.readAsText(f);e.target.value='';});
