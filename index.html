<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC &amp; Discount · Personal Management System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☘️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3; --card:#FFFFFF; --ink:#10201B; --ink2:#3A4D46; --muted:#7A8B85;
  --line:#E2E9E5; --line2:#F1F5F3;
  --indigo:#0E8A6B; --indigo2:#10A27E; --indigo-bg:#E2F3EC;
  --green:#15803D; --green-bg:#E6F5EB;
  --red:#D93A3A; --red-bg:#FDECEC;
  --amber:#B8720B; --amber-bg:#FCF2DF;
  --lav:#E4F2EC; --mint:#E6F5EB; --sky:#E7F0F6; --peach:#FCEFE0;
  --side1:#0F2B23; --side2:#0A1E18; --sidetxt:#C6DAD2; --sidemut:#7C9C92;
  --sh:0 1px 2px rgba(16,32,27,.04),0 10px 30px rgba(16,32,27,.06);
  --sh2:0 18px 50px rgba(16,32,27,.18);
  --sans:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:linear-gradient(180deg,var(--side1),var(--side2));color:var(--sidetxt);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.side .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,rgba(16,162,126,.35),rgba(16,162,126,.12));box-shadow:0 0 0 1px rgba(155,232,201,.25),0 6px 18px rgba(16,162,126,.35);display:grid;place-items:center;font-size:21px;flex:none}
.side .bt{font-weight:800;font-size:14.5px;line-height:1.2;background:linear-gradient(90deg,#FFFFFF,#9BE8C9);-webkit-background-clip:text;background-clip:text;color:transparent}
.side .bs{font-size:11px;color:var(--sidemut);font-weight:600;line-height:1.3;margin-top:2px}
.side .navlabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sidemut);font-weight:800;padding:14px 12px 6px;opacity:.8}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;color:var(--sidetxt);font-weight:700;font-size:14px;text-decoration:none}
.navbtn svg{width:18px;height:18px;flex:none;opacity:.85}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{background:linear-gradient(135deg,var(--indigo),var(--indigo2));color:#fff;box-shadow:0 6px 18px rgba(14,138,107,.35)}
.navbtn.sub{font-size:13px;padding:8px 12px 8px 41px;font-weight:600}
.navbtn.sub.on{background:rgba(255,255,255,.1);color:#fff}
.side .sfoot{margin-top:auto;font-size:11px;color:var(--sidemut);font-weight:600;padding:12px 12px 0;line-height:1.5}
.main{flex:1;min-width:0}
.wrap{max-width:1240px;margin:0 auto;padding:24px 22px 60px}

/* header */
.topbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.greet .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);font-weight:800}
.greet .eyesub{color:var(--muted);font-weight:700;letter-spacing:.1em}
.greet h1{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:6px 0 3px}
.greet p{margin:0;color:var(--muted);font-size:14px}
.spacer{flex:1}
.authbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 10px 7px 12px;box-shadow:var(--sh)}
.authbox .nm{font-weight:800;font-size:13px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.authbox .rl{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--green)}
.authbox .rl.prop{color:var(--indigo)}
.authbox .lnk{font-size:12px;font-weight:700;color:var(--muted)}
.gbtn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.gbtn svg{width:16px;height:16px}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh);margin-bottom:18px}
.fld{display:flex;align-items:center;gap:7px}
.fld label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.fld select,.fld input{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;font-weight:700;font-size:13px}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--indigo)}
.qbtn{font-size:12px;font-weight:700;color:var(--indigo);background:var(--indigo-bg);border-radius:8px;padding:6px 10px}
.qbtn:hover{filter:brightness(.96)}
.vsep{width:1px;height:26px;background:var(--line)}

.btn{border-radius:11px;padding:9px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo2)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink2);box-shadow:var(--sh)}
.btn.ghost:hover{background:var(--line2)}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.banner{border-radius:12px;padding:11px 15px;margin:0 0 16px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.banner.info{background:var(--indigo-bg);color:var(--ink2)}
.banner.warn{background:var(--amber-bg);color:#7d540e}
.banner.err{background:var(--red-bg);color:#a13030}
.banner b{font-weight:800}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:700}
.stat .num{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.stat .sub{font-size:12px;font-weight:700;margin-top:3px;color:var(--muted)}
.stat .sub b{color:var(--indigo)}
.stat.flag{cursor:pointer}
.stat.flag .num{color:var(--red)}
.stat.flag.zero .num{color:var(--green)}
.stat input.salein{width:100%;font-size:22px;font-weight:800;border:1px dashed var(--line);border-radius:9px;padding:2px 6px;margin-top:3px}

/* sections */
.sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 11px;flex-wrap:wrap}
.sec-head h2{font-size:17px;font-weight:800;margin:0}
.pill{font-size:11px;font-weight:800;color:#fff;background:var(--ink);border-radius:20px;padding:3px 9px}
.hint{font-size:12px;color:var(--muted);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto}
table{width:100%;border-collapse:collapse}
thead th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:left;padding:12px 12px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0;z-index:1}
thead th.r,td.r{text-align:right}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top;font-weight:600}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--line2)}
tfoot td{padding:11px 12px;background:linear-gradient(90deg,var(--indigo),var(--indigo2));color:#fff;font-weight:800}
.cat{display:flex;align-items:center;gap:9px;white-space:nowrap}
.cat .n{width:21px;height:21px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--lav);color:var(--indigo);flex:none}
.det{font-size:12px;color:var(--ink2);font-weight:600;line-height:1.4;max-width:300px;word-break:break-word}
.det.small{max-width:220px}
.st-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:14px;white-space:nowrap;display:inline-block}
.st-pill.ok{background:var(--green-bg);color:var(--green)}
.st-pill.no{background:var(--red-bg);color:var(--red)}
.st-pill.gr{background:var(--green-bg);color:var(--green);border:1px dashed var(--green)}
.st-pill.na{background:var(--line);color:var(--muted)}
.st-pill.pend{background:var(--amber-bg);color:var(--amber)}
.st-pill.sub{background:var(--indigo-bg);color:var(--indigo)}
tr.redrow td{background:#FFF7F7}
tr.greenrow td{background:#F6FBF8}
tr.hl td{background:#FFF8E6}

/* matrix */
.matrix td,.matrix th{text-align:right;white-space:nowrap;font-size:12.5px}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix td.over{background:var(--red-bg);color:var(--red);font-weight:800}
.matrix td.ovg{background:var(--green-bg);color:var(--green);font-weight:800}

/* entries */
.ent td{font-size:12.5px;padding:7px 8px}
.ent th{padding:10px 8px 8px}
.ent select,.ent input.t{border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:#fff;font-size:12.5px;font-weight:600;max-width:190px}
.ent input.t{width:120px}
.ent input.t.room{width:64px}
.ent select:focus,.ent input.t:focus{outline:none;border-color:var(--indigo)}
.ent select.miss{border-color:var(--amber);background:#FFFBF0}
.ent select:disabled,.ent input.t:disabled{background:transparent;border-color:transparent;color:var(--ink);opacity:1;-webkit-appearance:none;appearance:none}
.ent td:nth-child(-n+2){white-space:nowrap}
.ent .acc{font-size:11.5px;color:var(--muted);font-weight:700}
.tabs{display:inline-flex;background:var(--line);border-radius:11px;padding:3px}
.tabs button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--indigo);box-shadow:var(--sh)}
.iconbtn{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--line);color:var(--ink)}
.iconbtn.has{color:var(--amber);background:var(--amber-bg)}
.iconbtn svg{width:15px;height:15px}

/* cards for import/settings */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:15.5px;font-weight:800}
.card p{margin:0 0 12px;color:var(--muted);font-size:13px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-weight:700;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
textarea.box{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;background:var(--line2);resize:vertical}
textarea.box:focus{outline:none;border-color:var(--indigo);background:#fff}
.card > table.set thead th{position:static}
.set td input{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px;width:100%}
.set td input[type=checkbox]{width:auto}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(37,36,58,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.scrim.on{display:flex}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--sh2);width:100%;max-width:720px;padding:22px;max-height:90vh;overflow:auto;position:relative}
.modal.wide{max-width:1000px}
.modal h3{margin:0 0 4px;font-size:19px;font-weight:800}
.modal .lead{margin:0 0 14px;color:var(--muted);font-size:13px}
.modal .row{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.modal .x{position:absolute;top:14px;right:18px;font-size:24px;color:var(--muted)}
.modal textarea.mail{width:100%;min-height:380px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.55;font-family:var(--sans)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.empty{padding:28px;text-align:center;color:var(--muted);font-weight:600}
.signin{max-width:440px;margin:80px auto;text-align:center}
.signin h2{font-size:22px;margin:0 0 8px}

/* loading screen with shamrock */
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#16392F 0%,var(--side2) 70%);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash .clover{font-size:84px;line-height:1;animation:pop .8s ease-out both, spin 2.4s ease-in-out .8s infinite;filter:drop-shadow(0 10px 30px rgba(16,162,126,.45))}
#splash .nm{color:#fff;font-weight:800;font-size:18px;letter-spacing:-.01em}
#splash .bar{width:170px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .bar i{display:block;width:40%;height:100%;border-radius:4px;background:linear-gradient(90deg,#10A27E,#7BE0B8);animation:slide 1.1s ease-in-out infinite}
#splash .cap{color:var(--sidemut);font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes spin{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg) scale(1.06)}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#splash .clover,#splash .bar i{animation:none}}

/* attachments + queries */
.files{display:flex;flex-wrap:wrap;gap:5px;align-items:center;max-width:230px}
.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--line2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:11.5px;font-weight:700;color:var(--ink2);max-width:160px}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip:hover{border-color:var(--indigo);color:var(--indigo)}
.fchip .fx{color:var(--muted);font-weight:800;margin-left:2px}
.fchip .fx:hover{color:var(--red)}
.upbtn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);cursor:pointer;font-size:14px}
.upbtn:hover{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-bg)}
.q-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:14px;white-space:nowrap;display:inline-block}
.q-open{background:var(--red-bg);color:var(--red)}
.q-replied{background:var(--sky);color:#1D5F8A}
.q-resubmit{background:var(--amber-bg);color:var(--amber)}
.q-cleared{background:var(--green-bg);color:var(--green)}
.qcounts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.qcount{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);cursor:pointer;text-align:left}
.qcount.on{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-bg)}
.qcount .k{font-size:12px;color:var(--muted);font-weight:700}.qcount .v{font-size:24px;font-weight:800}
.thread{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{border-radius:14px;padding:10px 13px;background:var(--line2);max-width:88%}
.msg.mine{align-self:flex-end;background:var(--indigo-bg)}
.msg .who{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:3px}
.msg.k-resubmit{background:var(--amber-bg)}.msg.k-accept{background:var(--green-bg)}
.ulist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px}
.ulist label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.ulist label:hover{background:var(--line2)}
.ulist .em{color:var(--muted);font-size:12px;font-weight:600}
.navbtn .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px}
#veil{position:fixed;top:0;right:0;bottom:0;left:236px;z-index:45;display:grid;place-items:center;background:rgba(242,245,243,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
#veil.on{opacity:1}
#veil .c{font-size:64px;filter:drop-shadow(0 8px 22px rgba(16,162,126,.35));animation:pop .5s ease-out both, spin 1.2s ease-in-out infinite}
@media (max-width:900px){#veil{left:0}}
@media (prefers-reduced-motion:reduce){#veil .c{animation:none}}
#viewer{z-index:70}
#viewer .modal{max-width:1000px}
#viewer img{max-width:100%;max-height:72vh;display:block;margin:0 auto;border-radius:10px}
#viewer iframe{width:100%;height:72vh;border:0;border-radius:10px;background:var(--line2)}

@media (max-width:900px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}
  .side .brand,.side .navlabel,.side .sfoot{display:none}
  .navbtn{width:auto}.navbtn.sub{padding:8px 12px}
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  .side,.filters,.actions,.authbox,.noprint,.banner{display:none!important}
  .panel,.stat{box-shadow:none}
  .wrap{padding:0}
  thead th{position:static}
}
</style>
</head>
<body>

  <div class="clover">☘️</div>

</div>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="logo">☘️</div><div><div class="bt">Personal Management System</div><div class="bs">Moustache F&amp;B</div></div></div>
  <div class="navlabel">Dashboards</div>
  <a class="navbtn on" href="index.html">

    NC &amp; Discount
  </a>

  <button class="navbtn sub" data-tab="settings" id="nav-settings">Settings</button>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18l-7 8v6l-4 2v-8z"/></svg>

<div class="main"><div class="wrap">

      <h1 id="title">NC &amp; Discount Summary</h1>
      <p id="subline">—</p>

async function makeFirebase(){
  const [{initializeApp},A,F] = await Promise.all([
    import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")
  ]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app), db = F.getFirestore(app);
  const conv = o => { // turn DEL markers into deleteField()
    if(o===DEL) return F.deleteField();
    if(o && typeof o==="object" && !Array.isArray(o)){ const r={}; for(const k in o) r[k]=conv(o[k]); return r; }
    return o;
  };
  const CH = 900000; // bytes per Firestore chunk (doc limit is 1 MiB)
  return {
    onAuth: cb => A.onAuthStateChanged(auth, cb),
    signIn: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    signOut: () => A.signOut(auth),
    watch: (c,id,cb,err) => F.onSnapshot(F.doc(db,c,id), s=>cb(s.exists()?s.data():null), err),
    watchAll: (c,cb,err) => F.onSnapshot(F.collection(db,c), qs=>cb(qs.docs.map(d=>({id:d.id,...d.data()}))), err),
    watchWhere: (c,field,val,cb,err) => F.onSnapshot(F.query(F.collection(db,c),F.where(field,"==",val)), qs=>cb(qs.docs.map(d=>({id:d.id,...d.data()}))), err),
    merge: (c,id,obj) => F.setDoc(F.doc(db,c,id), conv(obj), {merge:true}),
    replace: (c,id,obj) => F.setDoc(F.doc(db,c,id), obj),
    add: async (c,obj) => (await F.addDoc(F.collection(db,c), obj)).id,
    append: (c,id,field,item,extra={}) => F.updateDoc(F.doc(db,c,id), {...extra,[field]:F.arrayUnion(item)}),
    idToken: () => auth.currentUser ? auth.currentUser.getIdToken() : Promise.resolve(""),
    // ---- attachments: stored as chunks in Firestore collection "ncd_files" ----
    putFile: async (meta, bytes) => {
      const ref = F.doc(F.collection(db,C_FILES)); const n = Math.max(1, Math.ceil(bytes.length/CH));
      for(let i=0;i<n;i++) await F.setDoc(F.doc(db,C_FILES,ref.id+"_"+i), {fid:ref.id, i, data:F.Bytes.fromUint8Array(bytes.subarray(i*CH,(i+1)*CH))});
      await F.setDoc(ref, {...meta, chunks:n, kind:"meta"});
      return ref.id;
    },
    getFile: async id => {
      const m = await F.getDoc(F.doc(db,C_FILES,id)); if(!m.exists()) throw new Error("File not found");
      const meta = m.data(); const parts = await Promise.all([...Array(meta.chunks).keys()].map(i=>F.getDoc(F.doc(db,C_FILES,id+"_"+i))));
      return new Blob(parts.map(p=>p.data().data.toUint8Array()), {type:meta.type||"application/octet-stream"});
    },
    delFile: async id => {
      const m = await F.getDoc(F.doc(db,C_FILES,id)); const n = m.exists()?m.data().chunks:0;
      for(let i=0;i<n;i++) await F.deleteDoc(F.doc(db,C_FILES,id+"_"+i));
      await F.deleteDoc(F.doc(db,C_FILES,id));
    },
  };
}

    idToken: async () => "mock",

    add: async (c,obj) => { const id="q"+(++nid)+"x"+Date.now(); store[c+"/"+id]=clone(obj); fire(c+"/"+id); return id; },

    putFile: async (meta,bytes) => { const id="f"+(++nid); files[id]={meta,bytes}; return id; },
    getFile: async id => new Blob([files[id].bytes],{type:files[id].meta.type}),

/* ---------- comment summary: merge repeats, case and near-spellings ---------- */
function osa(a,b){ const n=a.length,m=b.length; if(Math.abs(n-m)>2) return 9; const d=[];
  for(let i=0;i<=n;i++){ d[i]=[i]; } for(let j=0;j<=m;j++) d[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){ const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1); }
  return d[n][m]; }
const normC = s => (""+s).toLowerCase().replace(/[^a-z0-9& ]+/g," ").replace(/\s+/g," ").trim();
const titleC = s => s.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
function aliasMap(){ const m={}; (CFG.aliases||"").split("\n").forEach(l=>{ const [a,b]=l.split("=>").map(x=>x&&x.trim()); if(a&&b) m[normC(a)]=b; }); return m; }
function summarizeComments(list){
  const al=aliasMap(); const groups=[];
  list.forEach(raw=>{ if(!raw||!(""+raw).trim()) return;
    let k=normC(raw); let disp=null; if(al[k]){ disp=al[k]; k=normC(disp); }
    const thr = k.length>=10?2:k.length>=5?1:0;
    let g=groups.find(g=>g.k===k||(thr&&osa(g.k,k)<=thr));
    if(!g){ g={k,count:0,forms:{},fixed:null}; groups.push(g); }
    g.count++; if(disp) g.fixed=disp; const f=titleC((""+raw).trim().replace(/\s+/g," ")); g.forms[f]=(g.forms[f]||0)+1;
  });
  return groups.sort((a,b)=>b.count-a.count).map(g=>g.fixed||Object.entries(g.forms).sort((a,b)=>b[1]-a[1])[0][0]).join(", ");
}

function resubscribe(){

function entries(type, opt={}){
  const p=period(); const out=[];
  selectedProps().forEach(code=>p.months.forEach(ym=>{
    const d=DOCS[code+"_"+ym]; if(!d||!d[type]) return;
    Object.entries(d[type]).forEach(([id,e])=>{

      if(opt.submitted && e.st!=="sub") return;
      out.push({...e,id,prop:code,ym});

  }));

/* ---------- red flags ---------- */
function flags(){
  const out=[];
  const g={};
  entries("nc",{submitted:true}).forEach(e=>{ if(!e.cat||isExcludedNC(e.cat)) return;
    const k=e.prop+"|"+e.ym+"|"+e.cat; (g[k]=g[k]||{prop:e.prop,ym:e.ym,cat:e.cat,amt:0,list:[]}); g[k].amt+=+e.amount||0; g[k].list.push(e); });
  Object.values(g).forEach(x=>{ const cap=capFor(x.prop,x.cat); if(!ncCat(x.cat)||cap==null||x.amt<=+cap) return;
    const key="nc|"+safeId(x.cat);
    out.push({type:"nc",key,uid:x.prop+"_"+x.ym+"_"+key,prop:x.prop,ym:x.ym,cat:x.cat,amount:x.amt,cap:+cap,
      nos:x.list.map(e=>e.no),comments:x.list.map(e=>e.comment),green:greenOf(x.prop,x.ym,key),date:x.ym+"-01"}); });
  entries("disc",{submitted:true}).forEach(e=>{ if(!isAbove(e)) return;
    const key="d|"+e.id;
    out.push({type:"disc",key,uid:e.prop+"_"+e.ym+"_"+key,prop:e.prop,ym:e.ym,cat:e.cat,amount:+e.amount||0,value:+e.value,
      nos:[e.no],comments:[e.comment],green:greenOf(e.prop,e.ym,key),date:e.date,name:e.name}); });
  // open queries on entries in view -> attach to an existing flag, or add as their own red flag
  const p=period(); const props=new Set(selectedProps());
  QUERIES.filter(q=>q.status!=="cleared" && props.has(q.prop) && p.months.includes(q.ym) && q.date>=p.from && q.date<=p.to).forEach(q=>{
    let f = q.t==="disc" ? out.find(f=>f.type==="disc"&&!f.isQuery&&f.key==="d|"+q.entryId&&f.prop===q.prop)
                         : out.find(f=>f.type==="nc"&&!f.isQuery&&f.prop===q.prop&&f.ym===q.ym&&f.nos.includes(q.no));
    if(f){ (f.queries=f.queries||[]).push(q); return; }
    out.push({type:q.t,isQuery:true,key:"q|"+q.id,uid:q.prop+"_"+q.ym+"_q|"+q.id,prop:q.prop,ym:q.ym,cat:q.cat,amount:+q.amount||0,
      nos:[q.no],comments:[],green:null,date:q.date,queries:[q]});
  });
  return out.sort((a,b)=>a.prop.localeCompare(b.prop)||a.date.localeCompare(b.date));
}

  const panelScroll=[...document.querySelectorAll("[data-keep]")].map(el=>[el.dataset.keep,el.scrollTop,el.scrollLeft]);
  const fe=document.activeElement; let focusSel=null, focusVal=null, focusPos=null;

  let html=`<div id="errbanner"></div>`;
  if(S.tab!=="settings"&&S.tab!=="import") html+=filtersView();
  if(!cfgSaved && isEditor()) html+=`<div class="banner info">Using default categories, caps and lists. Review them in <b>Settings</b> and click Save once to store them for everyone.</div>`;
  if(S.tab==="summary") html+=summaryView();

  else if(S.tab==="import") html+=importView();
  else if(S.tab==="settings") html+= isEditor()?settingsView():`<div class="empty">Only Editors can change settings.</div>`;
  app.innerHTML=html;
  panelScroll.forEach(([k,t,l])=>{ const el=document.querySelector(`[data-keep="${k}"]`); if(el){ el.scrollTop=t; el.scrollLeft=l; } });
  window.scrollTo(0,keepScroll);
  updateBadge(); refreshOpenModals();
  if(focusSel){ const el=document.querySelector(focusSel); if(el){ if(el.tagName==="INPUT"){ el.value=focusVal; } el.focus({preventScroll:true}); try{ if(focusPos!=null&&el.setSelectionRange) el.setSelectionRange(focusPos,focusPos); }catch(e){} } }
}

function summaryData(){
  const p=period(); const props=selectedProps();
  const nc=entries("nc",{submitted:true}), disc=entries("disc",{submitted:true});
  const pendingNC=entries("nc").filter(e=>e.st!=="sub").length, pendingD=entries("disc").filter(e=>e.st!=="sub").length;
  let sale=0, saleMissing=0, saleCount=0;
  props.forEach(code=>p.months.forEach(ym=>{ const d=DOCS[code+"_"+ym]; if(d&&d.sale!=null&&d.sale!==""){ sale+=+d.sale; saleCount++; } else if(d) saleMissing++; }));
  const ncIn=nc.filter(e=>e.cat&&!isExcludedNC(e.cat)), ncEx=nc.filter(e=>isExcludedNC(e.cat));
  const totNC=ncIn.reduce((s,e)=>s+(+e.amount||0),0);
  const totD=disc.reduce((s,e)=>s+(+e.amount||0),0);
  const above=disc.filter(isAbove).reduce((s,e)=>s+(+e.amount||0),0);
  const fl=flags(); const redCount=fl.filter(f=>!f.green).length;
  return {p,props,nc,disc,ncIn,ncEx,pendingNC,pendingD,sale,saleMissing,saleCount,totNC,totD,above,fl,redCount};
}

async function ezCall(endpoint,code,from,to,extra={}){
  const tok=await DATA.idToken();
  const r=await fetch("/api/ezee",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({endpoint,hotel_code:code,from,to,...extra})});
  let j; try{ j=await r.json(); }catch(e){ throw new Error("The eZee bridge is not set up yet (HTTP "+r.status+"). Upload netlify/functions/ezee.mjs to GitHub."); }
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
const recs = j => { const d=j&&j.data; if(!d) return []; if(Array.isArray(d)) return d; if(Array.isArray(d.data)) return d.data; return []; };
/* ---------- eZee direct sync ---------- */
const NAMES={}; // hotel code -> {lookup}
async function namesFor(code){
  if(NAMES[code]) return NAMES[code];
  const j=await ezCall("names",code); const rows=j.names||[];
  const H=s=>normC(s).replace(/\s/g,"");
  const by={}; rows.forEach(r=>{ const k=H(r.h)+"|"+r.id; if(!by[k]) by[k]=r.d||r.t; });
  const look=(headers,id)=>{ for(const h of headers){ const v=by[H(h)+"|"+id]; if(v) return v; } return ""; };
  return NAMES[code]={rows:rows.length,look};
}
function chunks(from,to,days=7){ const out=[]; let a=new Date(from+"T00:00:00Z"); const end=new Date(to+"T00:00:00Z");
  while(a<=end){ const b=new Date(Math.min(end,a.getTime()+(days-1)*86400000)); out.push([a.toISOString().slice(0,10),b.toISOString().slice(0,10)]); a=new Date(b.getTime()+86400000); } return out; }
let SYNCING=false; const AUTO_DONE=new Set();
let SYNC_MSG={html:"",kind:"info"};
function syncBanner(html,kind="info"){ SYNC_MSG={html,kind}; const b=$("syncbanner"); if(!b) return; b.className=html?"banner "+kind:"hide"; b.innerHTML=html||""; }
async function syncEzee(codes,months,{silent=false}={}){
  if(SYNCING) return; SYNCING=true; const td=today(); let nNC=0,nD=0,errs=[];
  try{
    const jobs=[]; codes.forEach(code=>months.forEach(ym=>{ const from=ym+"-01", to=lastDay(ym)<td?lastDay(ym):td; if(from<=td) jobs.push({code,ym,from,to}); }));
    let done=0;
    for(const job of jobs){
      if(!silent) syncBanner(`Fetching from eZee… <b>${esc(propName(job.code))}</b> · ${ymLabel(job.ym)} (${++done}/${jobs.length})`);
      try{
        const nm=await namesFor(job.code);
        const nc={}, disc={}, sales={gross:0,discount:0,bills:0,ncBills:0};
        for(const [a,b] of chunks(job.from,job.to)){
          const j=await ezCall("extract",job.code,a,b);
          if(!j.ok) throw new Error(`eZee answered HTTP ${j.httpStatus}${j.message?": "+j.message:""}`);
          (j.nc||[]).forEach(e=>{ nc[safeId(e.no)]={date:e.date,no:e.no,order:e.order,amount:e.amount,tax:e.tax,final:e.final,
              account:nm.look(["CITY LEDGER","ROOM POSTING","PAYMENT"],e.accountId)||e.guest||"",guest:e.guest,src:"ezee"}; });
          (j.disc||[]).forEach(e=>{ const name=e.discId==="flat"?"Flat discount":(nm.look(["DISCOUNT"],e.discId)||(e.pct!=null?e.pct+"%":"Discount"));
            const lp=e.linePcts||[]; const spread=lp.length>1?Math.max(...lp)-Math.min(...lp):0;
            const isAmt = e.pct==null || /amount|flat|reelo/i.test(name) || spread>0.5 || Math.abs(e.pct-Math.round(e.pct))>0.05;
            const value = isAmt ? e.amount : Math.round(e.pct*100)/100;
            const id=safeId(e.no+"_"+(isAmt?"amt":value));
            if(disc[id]) disc[id].amount=Math.round((disc[id].amount+e.amount)*100)/100;
            else disc[id]={date:e.date,no:e.no,order:e.order,name,dtype:isAmt?"Amount":"Percentage",value,amount:e.amount,ezRemark:e.remark||"",src:"ezee"}; });
          ["gross","discount","bills","ncBills"].forEach(k=>sales[k]+=(j.sales&&+j.sales[k])||0);
        }
        await DATA.merge(C_MONTHS,job.code+"_"+job.ym,{prop:job.code,month:job.ym,nc,disc,
          ezee:{gross:Math.round(sales.gross),discount:Math.round(sales.discount),net:Math.round(sales.gross-sales.discount),bills:sales.bills,ncBills:sales.ncBills,from:job.from,to:job.to,syncedAt:Date.now(),by:S.user.email}});
        nNC+=Object.keys(nc).length; nD+=Object.keys(disc).length;
      }catch(e){ console.error(e); errs.push(`${propName(job.code)} ${ymLabel(job.ym)}: ${e.message}`); }
    }
  }finally{ SYNCING=false; }
  if(errs.length) syncBanner("eZee fetch had problems:<br>"+errs.map(esc).join("<br>"),"err");
  else{ syncBanner(""); if(!silent) toast(`eZee updated · ${nNC} NC · ${nD} discount entries`); }
  render();
}
function lastSynced(){ const p=period(); let t=null, missing=0;
  selectedProps().forEach(c=>p.months.forEach(ym=>{ if(ym+"-01">today()) return; const d=DOCS[c+"_"+ym]; const s=d&&d.ezee&&d.ezee.syncedAt; if(s) t=t==null?s:Math.min(t,s); else missing++; }));
  return {t,missing}; }
function maybeAutoSync(){
  if(S.role==="none"||S.prop==="__all"||SYNCING) return;
  const p=period(); if(p.months.length>2) return;
  const key=S.prop+"|"+p.months.join(","); if(AUTO_DONE.has(key)) return;
  setTimeout(()=>{ const ls=lastSynced(); if(AUTO_DONE.has(key)) return; AUTO_DONE.add(key);
    if(ls.missing||!ls.t||Date.now()-ls.t>30*60000) syncEzee([S.prop],p.months.filter(ym=>ym+"-01"<=today()),{silent:false}); },1500);
}

async function ezTest(){
  const t=EZT; t.prop=$("ez-prop").value; t.ep=$("ez-ep").value; t.from=$("ez-from").value; t.to=$("ez-to").value;
  if(t.from>t.to){ toast("To Date cannot be before From Date",true); return; }
  t.busy=true; t.summary=""; t.preview=""; t.result=null; render();
  try{
    if(t.ep==="ncdiff"){
      const [all,noNC]=await Promise.all([ezCall("sales",t.prop,t.from,t.to,{exclude_nocharge:0}),ezCall("sales",t.prop,t.from,t.to,{exclude_nocharge:1})]);
      const A=recs(all), B=new Set(recs(noNC).map(x=>x.record_id||x.reference1));
      const nc=A.filter(x=>!B.has(x.record_id||x.reference1));
      t.result={all,noNC,ncOnly:nc};
      t.okish=all.ok&&noNC.ok;
      t.summary=`eZee answered HTTP ${all.httpStatus}. Sales records: <b>${A.length}</b> with NC, <b>${B.size}</b> without NC → <b>${nc.length}</b> NC bills found.`;
      t.preview=JSON.stringify(nc.length?nc.slice(0,5):(all.data),null,2).slice(0,12000);
    }else{
      const j=await ezCall(t.ep,t.prop,t.from,t.to); const R=recs(j);
      t.result=j; t.okish=j.ok;
      t.summary=`eZee answered HTTP ${j.httpStatus} · status: <b>${esc((j.data&&(j.data.status||j.data.message))||"")}</b> · records: <b>${R.length}</b>`;
      t.preview=JSON.stringify(R.length?R.slice(0,5):j.data,null,2).slice(0,12000);
    }
  }catch(e){ t.okish=false; t.summary=esc(e.message); }
  t.busy=false; render();
}

function cellStr(v){ if(v==null) return ""; if(v instanceof Date) return v.toISOString().slice(0,10); return (""+v).trim(); }
async function parseFile(file){
  const X=await needXLSX(); const wb=X.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]]; const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const flat=rows.slice(0,4).map(r=>(r||[]).map(cellStr).join(" ")).join(" ");
  const type=/no\s*charge/i.test(flat)?"nc":/discount\s*detail/i.test(flat)?"disc":null;
  if(!type) throw new Error(file.name+": not a No Charge Sales Detail or Discount Detail report");
  const om=flat.match(/Outlet:\s*([^;]+?)(\s{2,}|$|;)/i); const outlet=om?om[1].trim():cellStr(rows[0]&&rows[0][0]);
  const rm=flat.match(/Date:\s*(\d{4}-\d{2}-\d{2})\s*To\s*(\d{4}-\d{2}-\d{2})/i);
  let date=null, out={}, grand=null;
  rows.forEach(r=>{ if(!r) return; const a=cellStr(r[0]), b=cellStr(r[1]);
    if(/^\d{4}-\d{2}-\d{2}$/.test(a) && !b){ date=a; return; }
    if(/^grand total/i.test(a)){ grand = type==="nc" ? +r[2] : +r[8]; return; }
    if(!date||!b) return;
    if(type==="nc" && /^NC-?\d/i.test(b)){
      const id=safeId(b); out[id]={date,no:b,order:a,amount:+r[2]||0,tax:+r[3]||0,final:+r[6]||0,account:cellStr(r[7])};
    }else if(type==="disc" && /^REC-?\d/i.test(b)){
      const dtype=cellStr(r[3])||"Percentage"; const val=parseFloat(cellStr(r[7]))||0;
      const id=safeId(b+"_"+(dtype==="Percentage"?val:"amt")); const amt=+r[8]||0;
      if(out[id]) { out[id].amount+=amt; } else out[id]={date,no:b,order:a,name:cellStr(r[2]),dtype,value:val,amount:amt};
    }
  });
  const list=Object.entries(out).map(([id,e])=>({id,...e}));
  const sum=list.reduce((s,e)=>s+e.amount,0);
  const n=normC(outlet.replace(/^moustache\s*/i,""));
  const prop=(CFG.properties.find(p=>p.ezee&&normC(p.ezee)===normC(outlet))||CFG.properties.find(p=>normC(p.name)===n)||CFG.properties.find(p=>n.includes(normC(p.name))||normC(p.name).includes(n))||{}).code||"";
  return {file:file.name,type,outlet,prop,rows:list,sum,grand,range:rm?fmtDate(rm[1])+" – "+fmtDate(rm[2]):""};
}
async function handleFiles(files){
  const res=[]; for(const f of files){ try{ res.push(await parseFile(f)); }catch(e){ toast(e.message,true); } }
  PARSED=PARSED.concat(res); render();
}

  }
  PARSED=[]; toast(`Imported ${n} entries`); render();
}

function readSettings(){
  const lines=id=>$(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
  const renames={};
  const ncCats=[...document.querySelectorAll("#s-nc tr")].map(tr=>{ const inp=tr.querySelector('[data-s=ncname]'); const n=inp.value.trim(); const c=tr.querySelector('[data-s=nccap]').value.replace(/[^0-9.]/g,"");
    if(n && inp.dataset.orig && inp.dataset.orig!==n) renames[inp.dataset.orig]=n; return n?{name:n,cap:c===""?null:+c}:null; }).filter(Boolean);
  const names=ncCats.map(c=>c.name);
  const capOverrides={};
  document.querySelectorAll("[data-cap]").forEach(inp=>{ const [code,cat0]=inp.dataset.cap.split("|"); const cat=renames[cat0]||cat0; if(!names.includes(cat)) return;
    const v=inp.value.trim(); if(v==="") return; const val=/^(na|n\/a|-|no cap)$/i.test(v)?null:+v.replace(/[^0-9.]/g,""); if(val!==null&&isNaN(val)) return;
    (capOverrides[code]=capOverrides[code]||{})[cat]=val; });
  const properties=[...document.querySelectorAll("#s-props tr")].map(tr=>{ const g=s=>tr.querySelector(`[data-s=${s}]`); const name=g("pname").value.trim(), code=g("pcode").value.trim(); return name&&code?{name,code,ezee:g("pezee").value.trim(),gm:g("pgm").value.trim(),reelo:g("preelo").checked}:null; }).filter(Boolean);
  const users=[...document.querySelectorAll("#s-users tr")].map(tr=>{ const em=tr.querySelector("[data-s=uemail]").value.trim().toLowerCase(); return em?{name:tr.querySelector("[data-s=uname]").value.trim()||em,email:em,prop:tr.querySelector("[data-s=uprop]").value}:null; }).filter(Boolean);
  const discCats=[...document.querySelectorAll("#s-dc [data-s=dcname]")].map(i=>i.value.trim()).filter(Boolean);
  return {ncCats,capOverrides,properties,users,discCats,ncExcluded:lines("s-ex"),signedBillCats:lines("s-sb"),ncApprovalFrom:lines("s-af"),ncApprovalStatus:lines("s-as"),discApproval:lines("s-da"),aliases:$("s-al").value,editors:lines("s-ed").map(s=>s.toLowerCase())};
}

const MAX_FILE = 5*1024*1024;
const ACCEPT = "image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt";
const fileIcon = t => /pdf/.test(t||"")?"📄":/image/.test(t||"")?"🖼️":"📎";
const fmtSize = n => n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function filesCell(e,t,opts={}){
  const k=fullKey(e,t); const fs=Object.entries(e.files||{}).filter(([,f])=>f&&f.name);
  const chips=fs.map(([fid,f])=>{ const canDel=isEditor()||(f.by===me());
    return `<button class="fchip" data-fopen="${esc(fid)}" data-fname="${esc(f.name)}" title="${esc(f.name)} · ${fmtSize(f.size||0)} · ${esc(f.by||"")}">${fileIcon(f.type)}<span>${esc(f.name)}</span>${canDel&&!opts.readonly?`<span class="fx" data-fdel="${esc(k+"|"+fid)}" title="Delete">×</span>`:""}</button>`; }).join("");
  const up = opts.readonly?"":`<label class="upbtn" title="Attach bill / photo / PDF (max 5 MB)"><input type="file" hidden multiple accept="${ACCEPT}" data-fup="${esc(k)}">＋</label>`;
  return `<div class="files">${chips}${up}</div>`;
}
async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size<450*1024) return file;
  try{
    const bmp=await createImageBitmap(file); const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    return blob && blob.size<file.size ? new File([blob],file.name.replace(/\.(png|webp)$/i,".jpg"),{type:"image/jpeg"}) : file;
  }catch(e){ return file; }
}
async function uploadFiles(key,list){
  const [prop,t,ym,id]=key.split("|"); let n=0;
  for(const f0 of list){
    const f=await shrinkImage(f0);
    if(f.size>MAX_FILE){ toast(`${f0.name} is larger than 5 MB`,true); continue; }
    toast(`Uploading ${f.name}…`);
    try{
      const bytes=new Uint8Array(await f.arrayBuffer());
      const meta={name:f.name,type:f.type||"application/octet-stream",size:f.size,by:me(),at:Date.now()};
      const fid=await DATA.putFile({...meta,prop,ym,t,entryId:id},bytes);
      await DATA.merge(C_MONTHS,prop+"_"+ym,{[t]:{[id]:{files:{[fid]:meta}}}});
      n++;
    }catch(e){ console.error(e); toast("Upload failed: "+(e.code||e.message),true); }
  }
  if(n) toast(`Attached ${n} file${n>1?"s":""}`);
}
async function openFile(fid,name){
  const v=$("viewer"), box=$("viewerbox");
  box.innerHTML=`<button class="x" data-act="closeviewer">×</button><h3>${esc(name)}</h3><p class="lead">Loading…</p>`; v.classList.add("on");
  try{
    const blob=await DATA.getFile(fid); const url=URL.createObjectURL(blob);
    const body = /^image\//.test(blob.type)?`<img src="${url}" alt="${esc(name)}">` : /pdf/.test(blob.type)?`<iframe src="${url}"></iframe>` : `<p class="lead">Preview isn't available for this file type.</p>`;
    box.innerHTML=`<button class="x" data-act="closeviewer">×</button><h3>${esc(name)}</h3><p class="lead">${fmtSize(blob.size)}</p>${body}
      <div class="row"><a class="btn primary" href="${url}" download="${esc(name)}">${I_DL} Download</a></div>`;
  }catch(e){ box.innerHTML=`<button class="x" data-act="closeviewer">×</button><h3>${esc(name)}</h3><div class="banner err">Could not open the file (${esc(e.code||e.message)}).</div>`; }

/* ---------- Convert to Mail ---------- */
function buildMail(){
  const code=S.prop; const p=propByCode(code)||{}; const per=period();
  const sel=flags().filter(f=>S.sel.has(f.uid)&&!f.green);
  const L="abcdefghijklmnopqrstuvwxyz";
  const sections=[];
  const grp=(arr)=>{ const m={}; arr.forEach(f=>{ (m[f.cat||"Uncategorised"]=m[f.cat||"Uncategorised"]||[]).push(...f.nos); }); return m; };
  const ncG=grp(sel.filter(f=>f.type==="nc")), dG=grp(sel.filter(f=>f.type==="disc"));
  if(Object.keys(ncG).length) sections.push(["NC",Object.entries(ncG).map(([c,n],i)=>`   ${L[i]}. ${compressNos(n)}  (Category: ${c})`).join("\n")+"\n   Kindly provide the supporting documents for the mentioned NCs."]);
  if(Object.keys(dG).length) sections.push(["Discount",Object.entries(dG).map(([c,n],i)=>`   ${L[i]}. ${compressNos(n)}  (Category: ${c})`).join("\n")+"\n   Kindly provide the supporting documents for the mentioned discounts."]);
  const sb=CFG.signedBillCats||[]; const sbl=[];
  sb.forEach(c=>{ const nn=entries("nc",{submitted:true}).filter(e=>e.cat===c).map(e=>e.no); const dn=entries("disc",{submitted:true}).filter(e=>e.cat===c).map(e=>e.no);
    if(nn.length) sbl.push([c,nn]); if(dn.length) sbl.push([c,dn]); });
  if(sbl.length) sections.push(["Signed Bills",sbl.map(([c,n],i)=>`   ${L[i]}. ${compressNos(n)}  (Category: ${c})`).join("\n")+"\n   Kindly share the signed bills for the above."]);
  const label = per.months.length===1&&!per.custom ? ymLabel(per.months[0]) : per.label;
  const subject=`Request for Clarification and Supporting Documents – ${p.name||code} – ${label}`;
  const body=`Dear ${p.gm||"[GM Name]"},\nI hope you are doing well.\n\nWe would appreciate your clarification and the relevant supporting documents for the following:\n\n`+
    sections.map(([h,t],i)=>`${i+1}. ${h}\n${t}`).join("\n\n")+`\n\n\nThanks & Regards,\n${S.user.displayName||S.user.email}`;
  return {subject,body,count:sel.length,sb:sbl.length};
}
function mailModal(){
  if(S.prop==="__all"){ toast("Choose one property first",true); return; }
  if(!S.sel.size){ toast("Tick the red-flag entries to include first",true); return; }

    <label class="hint">Subject</label><input id="ml-sub" class="fld" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:700;margin:4px 0 12px" value="${esc(m.subject)}">

    <div class="row"><button class="btn ghost" data-act="close">Close</button><button class="btn ghost" data-act="copysub">Copy subject</button><button class="btn primary" data-act="copybody">Copy message</button></div>`,true);

(async()=>{
  try{ DATA = MOCK ? makeMock() : await makeFirebase(); }
  catch(err){ hideSplash(); $("app").innerHTML=`<div class="banner err">Could not load Firebase (${esc(err.message)}). Check your internet connection and reload.</div>`; return; }
  render();
  DATA.onAuth(u=>{
    S.user=u||null;
    const email=(u&&u.email||"").toLowerCase();
    const company = !!u && email.endsWith("@"+COMPANY_DOMAIN) && (u.emailVerified!==false);
    if(cfgUnsub){ cfgUnsub(); cfgUnsub=null; }
    Object.keys(SUBS).forEach(k=>{ SUBS[k](); delete SUBS[k]; });
    if(qUnsub){ qUnsub(); qUnsub=null; } if(uUnsub){ uUnsub(); uUnsub=null; }
    if(!company){ S.role="none"; render(); hideSplash(); return; }
    DATA.merge(C_USERS,email,{email,name:u.displayName||email,last:Date.now()}).catch(e=>console.warn("user record",e));
    uUnsub=DATA.watchAll(C_USERS,list=>{ USERS={}; list.forEach(x=>{ if(x.email) USERS[x.email.toLowerCase()]=x; }); }, e=>console.warn(e));
    qUnsub=DATA.watchAll(C_QUERIES,list=>{ QUERIES=list; scheduleRender(); setTimeout(()=>maybePopup(false),900); }, e=>{ console.warn(e); });
    S.role = (email===MAIN_EDITOR || CFG.editors.includes(email)) ? "editor" : "prop";
    cfgUnsub=DATA.watch(C_CONFIG,"settings",c=>{
      cfgSaved=!!c; CFG = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)), c||{});
      S.role = (email===MAIN_EDITOR || (CFG.editors||[]).map(x=>x.toLowerCase()).includes(email)) ? "editor" : "prop";
      resubscribe(); scheduleRender(); hideSplash(); if(S.tab==="entries") maybeAutoSync();
    }, err=>{ console.error(err); showErr(err); hideSplash(); });
    resubscribe(); render();
  });
})();
</script>
</body>
</html>
